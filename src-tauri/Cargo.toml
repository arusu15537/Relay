[package]
name = "relay"
version = "0.1.0"
description = "Relay: plan with Claude, implement with a local LLM"
authors = ["Relay"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
rusqlite = { version = "0.42.0", features = ["bundled"] }
dirs = "7.0.0"
uuid = { version = "1.29.2", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
regex = "1.13.1"
ignore = "0.4.34"
which = "8.0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security"] }
tokio-util = "0.7.20"
sha2 = "0.11.1"
hex = "0.4.3"
similar = "3.2.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "native-tls"] }
keyring = "4.2.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
